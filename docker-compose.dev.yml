services:
  app:
    build:
      context: .
      target: development

    volumes:
      - .:/app
      - /app/node_modules

    command: yarn start:dev

    ports:
      - '3000:3000'

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy
